<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #1db954;
    }
    .brand {
      color: white;
      font-weight: bold;
    }
    .test-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1db954;
      color: white;
      padding: 20px;
      border-radius: 8px;
      font-size: 14px;
      max-width: 300px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="menu-overlay" id="menuOverlay"></div>
  
  <nav role="navigation" aria-label="Main navigation">
    <div class="brand">Test Hamburger Menu</div>

    <button class="menu-toggle" id="mobile-menu" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#help">Help</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="test-info">
    <div>🧪 Hamburger Test</div>
    <div>Click the ☰ button to test</div>
    <hr style="margin: 10px 0;">
    <div id="status">Waiting...</div>
  </div>

  <script>
    // Debug output
    const statusEl = document.getElementById('status');
    
    const toggle = document.getElementById("mobile-menu");
    const navLinks = document.querySelector(".nav-links");
    const menuOverlay = document.getElementById("menuOverlay");

    statusEl.textContent = `toggle: ${toggle ? '✓' : '✗'}\nnavLinks: ${navLinks ? '✓' : '✗'}\noverlay: ${menuOverlay ? '✓' : '✗'}`;

    if (toggle && navLinks && menuOverlay) {
      const closeNavMenu = () => {
        navLinks.classList.remove("active");
        toggle.classList.remove("active");
        menuOverlay.classList.remove("active");
        statusEl.textContent = "Menu: CLOSED";
      };

      const openNavMenu = () => {
        navLinks.classList.add("active");
        toggle.classList.add("active");
        menuOverlay.classList.add("active");
        statusEl.textContent = "Menu: OPEN ✓";
      };

      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (navLinks.classList.contains("active")) {
          closeNavMenu();
        } else {
          openNavMenu();
        }
      });

      menuOverlay.addEventListener("click", closeNavMenu);

      navLinks.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", closeNavMenu);
      });

      document.addEventListener("click", (e) => {
        if (navLinks.classList.contains("active")) {
          if (!e.target.closest(".nav-links") && !e.target.closest(".menu-toggle")) {
            closeNavMenu();
          }
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && navLinks.classList.contains("active")) {
          closeNavMenu();
        }
      });

      statusEl.textContent = "✓ Ready to test!";
    }
  </script>
</body>
</html>
